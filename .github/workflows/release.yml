name: Release

# Publishes to npm and creates a versioned GitHub release whenever a new
# version lands on main. Publishing is tokenless via the npm trusted
# publisher (OIDC): no NPM_TOKEN secret is required. The runner's default
# npm does not support trusted publishing, so it is pinned to ^11.5.1.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # required for npm trusted publisher (OIDC provenance)

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install -g "npm@^11.5.1"

      - name: Read package metadata
        id: meta
        run: |
          node -e "const p=require('./package.json');process.stdout.write('version='+p.version+'\n'+'name='+p.name+'\n')" >> "$GITHUB_OUTPUT"

      - name: Detect unpublished version
        id: check
        run: |
          CURRENT="${{ steps.meta.outputs.version }}"
          NAME="${{ steps.meta.outputs.name }}"
          PUBLISHED=$(npm view "${NAME}" version 2>/dev/null || true)
          echo "current=${CURRENT} published=${PUBLISHED}"
          if [ "${PUBLISHED}" = "${CURRENT}" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        if: steps.check.outputs.publish == 'true'
        run: |
          npm install --no-save --ignore-scripts typescript
          npm run typecheck

      - name: Publish to npm (trusted publisher / OIDC)
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public

      - name: Create GitHub release
        if: steps.check.outputs.publish == 'true'
        run: |
          gh release create "v${{ steps.meta.outputs.version }}" \
            --title "v${{ steps.meta.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
