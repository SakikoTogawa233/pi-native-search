# Supported provider registry for pi-native-search.
# The extension intentionally supports only providers whose server-side web
# search behavior is implemented.

providers:
  openai-codex:
    name: "OpenAI Codex"
    mode: "request_injection"
    # Injects { type: "web_search" } into the main Responses request.
    search_type: "openai_responses_web_search"

  kimi-coding:
    name: "Kimi For Coding"
    mode: "anthropic_server_tool"
    # Uses https://api.kimi.com/coding with web_search_20250305.
    search_type: "web_search_20250305"

  deepseek:
    name: "DeepSeek"
    mode: "anthropic_server_tool"
    # Uses https://api.deepseek.com/anthropic with web_search_20250305.
    search_type: "web_search_20250305"
